spring.application.name=cars365-backend

# choose active profile here (h2 or postgres)
spring.profiles.active=h2

# ===============================
# OPTIONAL (Recommended)
# ===============================
spring.jpa.open-in-view=false


#VIN Decoding Using the National Highway Traffic Safety Administration API
nhtsa.api.base-url=https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues

#Expiration time for JWT tokens (in milliseconds)
application.security.jwt.expiration=3600000


#SECRET-KEY for signing JWT tokens (Base64 encoded)
application.security.jwt.secret-key=${JWT_SECRET_KEY}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
