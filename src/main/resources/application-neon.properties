# Neon PostgreSQL credentials come from the private local file or environment.
spring.config.import=optional:file:./neon-local.properties
spring.datasource.url=${NEON_DATABASE_URL}
spring.datasource.username=${NEON_DATABASE_USERNAME}
spring.datasource.password=${NEON_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${NEON_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.sql.init.mode=never
